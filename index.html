<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HODU LOG</title><link rel="stylesheet" href="./style.css?v=20261126-5"></head><body><main><span id="status" hidden>연결 확인 중</span><section class="hero"><div><h1>Hodu's log.</h1><p class="sub"><span id="today"></span></p></div><svg class="cat" viewBox="0 0 150 120" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-label="손그림 고양이"><path d="M29 77Q20 62 28 44L31 17 53 35Q69 30 85 35L107 18 110 46Q124 62 110 79Q99 91 78 88Q54 94 39 85Z"/><path d="M43 89Q29 99 45 105L92 105Q110 102 101 89M108 99Q137 99 133 78Q131 72 126 76M60 39l3 9m10-10 1 9m10-8-3 9M25 58l-10-3m11 10-12 3m100-9 11-4m-11 10 12 2"/><path d="M65 64l5 4 5-4m-5 4q-1 7-7 4m7-4q2 7 8 3M59 101l-1-7m24 7 1-7"/><circle cx="53" cy="56" r="2.6" fill="currentColor" stroke="none"/><circle cx="88" cy="56" r="2.6" fill="currentColor" stroke="none"/><path d="M126 28q4-7 7 0 4-7 8-3 3 5-8 12-10-5-7-9Z" stroke-width="1.8"/></svg></section><section class="panel" id="login"><h2>로그인</h2><form id="loginform"><label for="email">이메일</label><input id="email" type="email" autocomplete="username" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">로그인</button></form><p id="loginmsg" role="status"></p></section><div id="dashboard" hidden><div class="head"><button id="refresh">새로고침</button><button id="logout">로그아웃</button></div><div class="layout"><section class="panel"><div class="head"><h2>혈당 추이</h2><div class="tabs" id="tabs"><button data-days="7" class="active">7일</button><button data-days="30">30일</button><button data-days="90">90일</button><button data-days="0">전체</button></div></div><div class="stats"><div><label>최근 혈당</label><div class="num"><span id="latest">—</span> <small>mg/dL</small></div></div><div><label>기간 평균</label><div class="num"><span id="avg">—</span> <small>mg/dL</small></div></div></div><div id="chart"></div><p class="notice" id="count"></p></section><section class="panel entry"><h2 id="formtitle">새 기록</h2><form id="form"><div class="pair"><div><label for="date">날짜</label><input id="date" type="date" required></div><div><label for="time">시간</label><input id="time" type="time" required></div></div><label for="glucose">혈당 (mg/dL)</label><input id="glucose" type="number" min="1" max="1500" step="1" inputmode="numeric" placeholder="예: 180"><div class="pair"><div><label for="meal">측정 시점</label><select id="meal"><option>미기록</option><option>식전</option><option>식후</option><option>공복</option></select></div><div><label for="med">엔블로</label><select id="med"><option>미기록</option><option>복용</option><option>미복용</option></select></div></div><div class="pair"><div><label for="weight">체중 (kg)</label><input id="weight" type="number" min="0.1" max="30" step="0.01" placeholder="4.75"></div><div><label for="ketone">케톤</label><select id="ketone"><option>미측정</option><option>음성</option><option>양성</option><option>기타 (메모)</option></select></div></div><label for="note">특이사항 / 검사 결과</label><textarea id="note" rows="2" placeholder="식사량, 컨디션, 프룩토사민 등"></textarea><button class="primary" type="submit">기록 저장 +</button><button type="button" id="cancel" hidden>수정 취소</button></form></section></div><section class="panel history"><div class="head"><h2>기록 내역</h2><details class="data-tools"><summary>데이터 관리</summary><div class="tabs"><button id="csv">CSV</button><button id="backup">백업</button><button id="restore">복원</button><input type="file" id="file" accept="application/json" hidden style="display:none"></div></details></div><div class="tablewrap"><table><thead><tr><th>날짜 / 시간</th><th>혈당</th><th>시점</th><th>약</th><th>체중</th><th>케톤</th><th>메모</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div><nav class="pagination" aria-label="기록 페이지"><button id="prevPage">이전</button><span id="pageInfo" aria-live="polite"></span><button id="nextPage">다음</button></nav></section><button id="migrate" hidden>이 브라우저의 기존 기록 가져오기</button><p id="syncmsg" role="status"></p></div><footer>로그인 계정의 데이터베이스에 기록을 저장합니다. 정기적으로 백업해 주세요.<br>혈당 수치만으로 건강 상태를 판단하지 마세요. 기록은 수의사 상담을 위한 참고 자료입니다.</footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./app.js?v=20261126-3"></script></body></html>

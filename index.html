<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HODU LOG</title><link rel="stylesheet" href="./style.css"></head><body><main><header><strong>HODU / LOG</strong><span class="pill">PRIVATE · LOCAL</span></header><section class="hero"><div><div class="eyebrow">A LITTLE BETTER, EVERY DAY.</div><h1>Hodu's log.</h1><p class="sub">호두의 건강 기록 <span id="today"></span></p></div><svg class="cat" viewBox="0 0 100 85" fill="none" stroke="#75634f" stroke-width="2.5" stroke-linejoin="round"><path fill="#e6d4b8" d="M14 41 13 9 36 25Q50 20 65 25L88 9 87 42Q98 72 50 76 2 72 14 41Z"/><path d="m39 26 3 13m8-15v13m11-11-3 13M17 49l13 3m53-3-13 3M18 58l12-1m52 1-12-1"/><circle cx="34" cy="46" r="2.5" fill="#75634f"/><circle cx="66" cy="46" r="2.5" fill="#75634f"/><path d="m47 53 3 3 3-3m-3 3q-3 7-8 2m8-2q3 7 8 2"/></svg></section><div class="layout"><section class="panel"><div class="head"><h2>혈당 추이</h2><div class="tabs" id="tabs"><button data-days="7" class="active">7일</button><button data-days="30">30일</button><button data-days="90">90일</button><button data-days="0">전체</button></div></div><div class="stats"><div><label>최근 혈당</label><div class="num"><span id="latest">—</span> <small>mg/dL</small></div></div><div><label>기간 평균</label><div class="num"><span id="avg">—</span> <small>mg/dL</small></div></div></div><div id="chart"></div><p class="notice" id="count"></p></section><section class="panel entry"><h2 id="formtitle">새 기록</h2><form id="form"><div class="pair"><div><label for="date">날짜</label><input id="date" type="date" required></div><div><label for="time">시간</label><input id="time" type="time" required></div></div><label for="glucose">혈당 (mg/dL)</label><input id="glucose" type="number" min="1" max="1500" step="1" inputmode="numeric" placeholder="예: 180"><div class="pair"><div><label for="meal">측정 시점</label><select id="meal"><option>미기록</option><option>식전</option><option>식후</option><option>공복</option></select></div><div><label for="med">엔블로</label><select id="med"><option>미기록</option><option>복용</option><option>미복용</option></select></div></div><div class="pair"><div><label for="weight">체중 (kg)</label><input id="weight" type="number" min="0.1" max="30" step="0.01" placeholder="4.75"></div><div><label for="ketone">케톤</label><select id="ketone"><option>미측정</option><option>음성</option><option>양성</option><option>기타 (메모)</option></select></div></div><label for="note">특이사항 / 검사 결과</label><textarea id="note" rows="2" placeholder="식사량, 컨디션, 프룩토사민 등"></textarea><button class="primary" type="submit">기록 저장 +</button><button type="button" id="cancel" hidden>수정 취소</button></form></section></div><section class="panel history"><div class="head"><h2>기록 내역</h2><div class="tabs"><button id="csv">CSV</button><button id="backup">백업</button><button id="restore">복원</button><input type="file" id="file" accept="application/json" hidden style="display:none"></div></div><div class="tablewrap"><table><thead><tr><th>날짜 / 시간</th><th>혈당</th><th>시점</th><th>약</th><th>체중</th><th>케톤</th><th>메모</th><th>관리</th></tr></thead><tbody id="rows"></tbody></table></div></section><footer>이 버전은 현재 브라우저에만 데이터를 저장합니다. 기기 간 동기화는 지원하지 않으며, 브라우저 데이터 삭제 전 백업이 필요합니다.<br>혈당 수치만으로 건강 상태를 판단하지 마세요. 기록은 수의사 상담을 위한 참고 자료입니다.</footer></main><script src="./app.js"></script></body></html>
